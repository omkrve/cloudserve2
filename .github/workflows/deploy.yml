name: CloudServe CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "scripts/deploy-on-ec2.sh"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloudserve-deployment
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: "947317651355"
  ECR_REPOSITORY: cloudserve

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::947317651355:role/CloudServeGitHubActionsRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          docker build \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            ./app

          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      - name: Prepare deployment command
        env:
          IMAGE_TAG: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          REGISTRY="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY"
          IMAGE_URI="$REGISTRY:$IMAGE_TAG"
          SCRIPT_URL="https://raw.githubusercontent.com/omkrve/cloudserve2/${GITHUB_SHA}/scripts/deploy-on-ec2.sh"

          # Validate that the versioned script exists and matches this commit.
          curl --fail --silent --show-error --location \
            "$SCRIPT_URL" -o downloaded-deploy-script.sh

          cmp scripts/deploy-on-ec2.sh downloaded-deploy-script.sh

          jq -n \
            --arg region "$AWS_REGION" \
            --arg registry "$REGISTRY" \
            --arg script_url "$SCRIPT_URL" \
            --arg image_uri "$IMAGE_URI" \
            '{
              commands: [
                "set -e",
                ("aws ecr get-login-password --region " + $region + " | docker login --username AWS --password-stdin " + $registry),
                ("curl --fail --silent --show-error --location " + $script_url + " -o /tmp/cloudserve-deploy.sh"),
                "chmod 700 /tmp/cloudserve-deploy.sh",
                ("bash /tmp/cloudserve-deploy.sh " + $image_uri),
                "rm -f /tmp/cloudserve-deploy.sh"
              ]
            }' > deployment-parameters.json

          jq -e '.commands | type == "array"' deployment-parameters.json >/dev/null
          rm -f downloaded-deploy-script.sh

      - name: Deploy through AWS Systems Manager
        id: deploy
        shell: bash
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --targets \
              "Key=tag:Project,Values=cloudserve" \
              "Key=tag:Environment,Values=dev" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy CloudServe commit $GITHUB_SHA" \
            --parameters file://deployment-parameters.json \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "SSM command submitted: $COMMAND_ID"

          for i in $(seq 1 30); do
            STATUS=$(aws ssm list-command-invocations \
              --command-id "$COMMAND_ID" \
              --details \
              --query "CommandInvocations[0].Status" \
              --output text)

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              exit 0
            fi

            if [ "$STATUS" = "Failed" ] || \
               [ "$STATUS" = "TimedOut" ] || \
               [ "$STATUS" = "Cancelled" ]; then
              aws ssm list-command-invocations \
                --command-id "$COMMAND_ID" \
                --details
              exit 1
            fi

            sleep 10
          done

          echo "Timed out waiting for deployment command."
          exit 1

      - name: Remove temporary deployment files
        if: always()
        run: rm -f deployment-parameters.json downloaded-deploy-script.sh
